<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square background for premium icon styling -->
  <rect width="64" height="64" rx="16" fill="#0B1220"/>
  
  <defs>
    <!-- Gradients matching the patient portal (blue/cyan) and hcp portal style -->
    <linearGradient id="blueG" x1="16" y1="18" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1774e6"/>
      <stop offset="100%" stop-color="#0d7de6"/>
    </linearGradient>
    <linearGradient id="tealG" x1="22" y1="22" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28d5c9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left link / 'D' element -->
  <path d="M24 19H32C37.5 19 42 23.5 42 29C42 34.5 37.5 39 32 39H24C21.2 39 19 36.8 19 34V24C19 21.2 21.2 19 24 19Z" 
        stroke="url(#blueG)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right link / 'L' connection -->
  <path d="M40 45H32C26.5 45 22 40.5 22 35C22 29.5 26.5 25 32 25H40C42.8 25 45 27.2 45 30V40C45 42.8 42.8 45 40 45Z" 
        stroke="url(#tealG)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Connecting link highlight node -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
